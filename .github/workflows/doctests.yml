name: doctests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  doctests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install acoustotreams and Sphinx
      run: python -m pip install -e . sphinx
      
    - name: Run doctests
      env:
        SKIP_PLOTS: "1"
      run: python -m sphinx -b doctest docs docs/_build/doctest