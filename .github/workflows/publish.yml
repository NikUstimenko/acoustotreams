name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install build tools
      run: python -m pip install build twine

    - name: Build package
      run: python -m build

    - name: Check that the release tag matches the package version
      run: |
        tag="${GITHUB_REF_NAME#v}"
        if [ ! -f "dist/acoustotreams-${tag}.tar.gz" ]; then
          echo "::error::Release tag ${GITHUB_REF_NAME} does not match the version in setup.py"
          exit 1
        fi
        if ! grep -q "^__version__ = \"${tag}\"" acoustotreams/__init__.py; then
          echo "::error::Release tag ${GITHUB_REF_NAME} does not match __version__ in acoustotreams/__init__.py"
          exit 1
        fi
        echo "Version ${tag} matches the release tag"

    - name: Check package metadata
      run: python -m twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1