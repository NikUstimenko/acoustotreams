name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 3
      matrix:
        python-version: ["3.11"]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install acoustotreams[test,coverage,io]
          python -m pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/unit --cov=acoustotreams --cov-report=html

      - name: Get coverage report
        run: |
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text())
          percent = report["totals"]["percent_covered"]
          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{percent:.1f}%",
              "color": "brightgreen" if percent >= 90 else "yellow" if percent >= 75 else "red",
          }
          Path("htmlcov/endpoint.json").write_text(json.dumps(badge) + "\n")
          PY

      - name: Prepare coverage files for publishing
        run: |
          rm -f htmlcov/.gitignore
          test -s htmlcov/index.html
          test -s htmlcov/endpoint.json

      - name: Deploy report
        if: ${{ matrix.python-version == '3.11' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: htmlcov
          publish_dir: ./htmlcov